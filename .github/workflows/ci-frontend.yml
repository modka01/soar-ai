name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # ci, not install: the dependency tree must match the reviewed lockfile.
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  build:
    name: Bundle and image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Build the bundle
        run: npm run build

      - name: Check the bundle budget
        # A console that takes too long to load during an incident is a real
        # cost; fail the build rather than let it creep.
        run: |
          SIZE_KB=$(du -sk dist | cut -f1)
          echo "bundle: ${SIZE_KB} KB"
          if [ "$SIZE_KB" -gt 3072 ]; then
            echo "::error::Bundle is ${SIZE_KB} KB, over the 3 MB budget."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: soar-ai-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name soar-web-smoke -e API_UPSTREAM=127.0.0.1:8000 -p 8080:8080 soar-ai-frontend:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              curl -fsS http://localhost:8080/ | grep -q '<div id="root">' \
                && echo "console is being served"
              docker rm -f soar-web-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs soar-web-smoke
          docker rm -f soar-web-smoke
          exit 1
