name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: Image tag to deploy (defaults to this commit)
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  # One deployment per environment at a time; a queued run supersedes an
  # older one rather than racing it.
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # Nothing is published until the full suite passes.
  verify:
    name: Verify
    uses: ./.github/workflows/ci-backend.yml

  verify-frontend:
    name: Verify frontend
    uses: ./.github/workflows/ci-frontend.yml

  verify-deploy:
    name: Verify deployment artifacts
    uses: ./.github/workflows/ci-deploy-artifacts.yml

  publish:
    name: Publish images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify, verify-frontend, verify-deploy]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve the tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="$(git rev-parse --short HEAD)"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing as ${TAG}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/soar-ai-backend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/soar-ai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/soar-ai-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/soar-ai-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
            VITE_API_BASE_URL=

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: publish
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://soar-staging.quantnexa.com
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Configure cluster access
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          NAMESPACE: soar-staging
        run: ./deploy/scripts/deploy.sh staging --tag "$IMAGE_TAG" --timeout 15m

      - name: Post-deploy smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 https://soar-staging.quantnexa.com/health/ready; then
              echo "staging is healthy"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Staging did not report ready after the deploy."
          exit 1

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [publish, deploy-staging]
    # Manual only, and gated by the environment's required reviewers — a SOC
    # console is not something a merge should ship on its own.
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://soar.quantnexa.com
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Configure cluster access
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Record the current revision
        id: current
        env:
          NAMESPACE: soar-production
        run: |
          REVISION="$(helm history soar-ai -n "$NAMESPACE" --max 1 -o json 2>/dev/null \
            | grep -o '"revision":[0-9]*' | head -1 | cut -d: -f2 || echo '')"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "Current revision: ${REVISION:-none}"

      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          NAMESPACE: soar-production
        run: ./deploy/scripts/deploy.sh production --tag "$IMAGE_TAG" --timeout 20m

      - name: Post-deploy smoke test
        id: smoke
        run: |
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 https://soar.quantnexa.com/health/ready; then
              echo "production is healthy"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Production did not report ready after the deploy."
          exit 1

      - name: Roll back on a failed smoke test
        # deploy.sh rolls back what Helm can see; this covers a rollout that
        # went healthy for Helm but is failing real traffic.
        if: failure() && steps.current.outputs.revision != ''
        env:
          NAMESPACE: soar-production
          FORCE: 'true'
        run: ./deploy/scripts/rollback.sh production "${{ steps.current.outputs.revision }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image tag | \`${{ needs.publish.outputs.image_tag }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Previous revision | ${{ steps.current.outputs.revision || 'none' }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
