{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.externalSecrets.enabled) }}
{{- if eq .Values.config.environment "production" }}
{{- fail "secrets.create must not be used in production. Set secrets.existingSecret, or enable externalSecrets to sync from your vault." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "soar-ai.fullname" . }}-secrets
  labels:
    {{- include "soar-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
