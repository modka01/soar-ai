apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soar-ai.fullname" . }}-config
  labels:
    {{- include "soar-ai.labels" . | nindent 4 }}
data:
  # Non-sensitive configuration, surfaced here so an operator can inspect what
  # the platform is running with. Every secret lives in the Secret instead.
  environment: {{ .Values.config.environment | quote }}
  log-level: {{ .Values.config.logLevel | quote }}
  log-format: {{ .Values.config.logFormat | quote }}
  cors-origins: {{ .Values.config.corsOrigins | quote }}
  anthropic-model: {{ .Values.config.anthropic.model | quote }}
  agent-max-iterations: {{ .Values.config.anthropic.agentMaxIterations | quote }}
  embedding-provider: {{ .Values.config.rag.embeddingProvider | quote }}
  rag-top-k: {{ .Values.config.rag.topK | quote }}
  aws-region: {{ .Values.config.aws.region | quote }}
  n8n-url: {{ .Values.config.n8n.url | quote }}
  allow-destructive-actions: {{ .Values.config.safety.allowDestructiveActions | quote }}
  require-approval-for-containment: {{ .Values.config.safety.requireApprovalForContainment | quote }}
