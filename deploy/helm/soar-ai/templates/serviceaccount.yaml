{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "soar-ai.serviceAccountName" . }}
  labels:
    {{- include "soar-ai.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No API access is needed, so no token is mounted into the pods.
automountServiceAccountToken: false
{{- end }}
