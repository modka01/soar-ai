{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "soar-ai.fullname" . }}-backend
  labels:
    {{- include "soar-ai.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "soar-ai.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the console's nginx pods and the ingress controller may reach the API.
    - from:
        - podSelector:
            matchLabels:
              {{- include "soar-ai.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 8000
    {{- if .Values.metrics.enabled }}
    # Prometheus scrapes /metrics.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
  egress:
    # DNS must be allowed explicitly, or every outbound call fails to resolve.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Datastores, the workflow engine, and HTTPS to the security vendors and
    # the Anthropic API.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              # Block link-local so a compromised pod cannot reach the cloud
              # instance metadata service and steal node credentials.
              - 169.254.169.254/32
      ports:
        {{- range .Values.networkPolicy.allowedEgressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "soar-ai.fullname" . }}-frontend
  labels:
    {{- include "soar-ai.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "soar-ai.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The console proxies to the API and needs nothing else.
    - to:
        - podSelector:
            matchLabels:
              {{- include "soar-ai.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
