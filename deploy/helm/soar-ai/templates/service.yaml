apiVersion: v1
kind: Service
metadata:
  name: {{ include "soar-ai.fullname" . }}-backend
  labels:
    {{- include "soar-ai.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.backendPort }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "soar-ai.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "soar-ai.fullname" . }}-frontend
  labels:
    {{- include "soar-ai.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.frontendPort }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "soar-ai.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
