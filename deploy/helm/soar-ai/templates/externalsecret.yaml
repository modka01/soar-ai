{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "soar-ai.fullname" . }}-secrets
  labels:
    {{- include "soar-ai.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "soar-ai.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    # Pulled from the vault under the configured prefix. A key that is absent
    # upstream simply leaves that integration unconfigured, which the platform
    # reports rather than failing on.
    {{- $prefix := .Values.externalSecrets.remoteKeyPrefix }}
    {{- range $key := list
        "secret-key"
        "webhook-hmac-secret"
        "database-url"
        "redis-url"
        "anthropic-api-key"
        "voyage-api-key"
        "splunk-token"
        "elastic-api-key"
        "crowdstrike-client-id"
        "crowdstrike-client-secret"
        "virustotal-api-key"
        "abuseipdb-api-key"
        "otx-api-key"
        "misp-api-key"
        "paloalto-api-key"
        "jira-token"
        "n8n-api-key"
        "slack-webhook-url"
        "pagerduty-routing-key"
        "smtp-password"
        "bootstrap-admin-password"
    }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $prefix }}/{{ $key }}
    {{- end }}
{{- end }}
