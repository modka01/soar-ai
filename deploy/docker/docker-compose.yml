# ─────────────────────────────────────────────────────────────
# Local development and image smoke-testing stack.
#
#   docker compose -f deploy/docker/docker-compose.yml up -d
#
# Production runs on Kubernetes via the Helm chart in deploy/helm;
# this file exists so the same images can be exercised locally
# before they reach a cluster.
# ─────────────────────────────────────────────────────────────

name: soar-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soar-local-dev}
      POSTGRES_DB: soar
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soar -d soar']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Applies migrations and seeds baseline content, then exits. The API waits
  # for it so the schema is always ahead of the code that queries it.
  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ['migrate']
    environment: &backend-env
      SOAR_ENVIRONMENT: development
      SOAR_LOG_FORMAT: console
      SOAR_DEBUG: 'true'
      SOAR_SECRET_KEY: ${SOAR_SECRET_KEY:-local-dev-secret-not-for-production}
      SOAR_WEBHOOK_HMAC_SECRET: ${SOAR_WEBHOOK_HMAC_SECRET:-local-dev-hmac}
      SOAR_DATABASE_URL: postgresql+asyncpg://soar:${POSTGRES_PASSWORD:-soar-local-dev}@postgres:5432/soar
      SOAR_REDIS_URL: redis://redis:6379/0
      SOAR_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      SOAR_ANTHROPIC_API_KEY: ${SOAR_ANTHROPIC_API_KEY:-}
      SOAR_ALLOW_DESTRUCTIVE_ACTIONS: 'false'
      SOAR_BOOTSTRAP_ADMIN_EMAIL: ${SOAR_BOOTSTRAP_ADMIN_EMAIL:-admin@quantnexa.io}
      SOAR_BOOTSTRAP_ADMIN_PASSWORD: ${SOAR_BOOTSTRAP_ADMIN_PASSWORD:-}
      SOAR_N8N_URL: http://n8n:5678
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ['api']
    environment:
      <<: *backend-env
      SOAR_WEB_CONCURRENCY: '2'
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ['worker']
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ''
    environment:
      API_UPSTREAM: api:8000
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: 'false'
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - '5678:5678'
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  n8n-data:
